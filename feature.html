
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- 01. BASIC PAGE SETTINGS -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#71845A">
  <title>Your Space | To the Ether.</title>

  <!-- 02. FONTS AND MAIN CSS FILE -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="feature-page">

  <!-- 03. FEATURE PAGE HEADER AND RETURN BUTTON -->
  <header class="navbar">
    <a class="logo" href="index.html">to the ether<span>.</span></a>
    <a class="account-button" href="index.html#explore">← All spaces</a>
  </header>

  <main class="feature-main">

    <!-- 04. FEATURE TITLE AND DESCRIPTION
         JavaScript changes these for each selected card. -->
    <div class="feature-top">
      <span class="eyebrow" id="featureEyebrow">YOUR PERSONAL SPACE</span>
      <h1 id="featureTitle">Welcome.</h1>
      <p id="featureDescription">Take your time. There's no rush.</p>
    </div>

    <!-- 05. FEATURE PAGE BACKGROUND COLOUR CONTROL -->
    <div class="background-settings" id="backgroundSettings">
      Customise this space's background:
      <input type="color" id="featureColour" value="#364333" aria-label="Choose page background">
      <button id="resetColour" class="tool-button secondary" type="button">Reset</button>
    </div>

    <!-- 06. FEATURE CONTENT
         The selected card's tools are loaded into this container. -->
    <div id="featureContent" class="feature-content"></div>

    <!-- 07. SAVED PAGES FOR THIS FEATURE -->
    <section class="save-section">
      <h2>My saved pages</h2>
      <p>Your saved creations in this space.</p>
      <div id="featureSavedPages" class="saved-grid"></div>
    </section>

  </main>

  <!-- 08. FEATURE PAGE FOOTER -->
  <footer>
    <a class="logo" href="index.html">to the ether<span>.</span></a>
    <p>You can always begin again.</p>
  </footer>

  <!-- 09. FEATURE PAGE JAVASCRIPT -->
  <script src="feature.js"></script>
</body>
</html>
