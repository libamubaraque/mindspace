
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#414B2D">
  <title>Your Space | To the Ether.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="feature-page">
  <header class="feature-top">
    <a class="logo" href="index.html">To the ether<span>.</span></a>
    <a class="button button-outline" href="index.html#explore">← All spaces</a>
  </header>

  <main class="feature-main">
    <p class="eyebrow">Your personal space</p>
    <h1 id="featureTitle">Welcome to your space.</h1>
    <p class="feature-description" id="featureDescription"></p>

    <section class="feature-panel" id="featureContent">
      <p class="muted">Loading your space...</p>
    </section>

    <section class="feature-panel">
      <h2>Make it yours.</h2>
      <p class="muted">You can choose a background colour for this space. Your choice is saved on this device.</p>
      <label class="field-label" for="cardBackground">Choose a background colour</label>
      <input class="feature-input" type="color" id="cardBackground" value="#414B2D">
      <div class="feature-actions">
        <button class="button button-outline" id="resetBackground">Restore original</button>
      </div>
    </section>

    <section class="feature-panel">
      <h2>Your saved pages.</h2>
      <p class="muted">Entries you save in this space will appear below and on the homepage.</p>
      <div id="featureSavedPages" class="saved-grid"></div>
    </section>
  </main>

  <script src="feature.js"></script>
</body>
</html>
